experiment: rtfocuser_shift_dst_t3_gopro_bsd_dvd_fullframe_v3
seed: 20260909
output: /mnt/ssd1/z00919662/motion_deblur/runs/rtfocuser_shift_dst_t3_gopro_bsd_dvd_fullframe_v3

# The first existing root with a valid strict paired-frame layout is selected.
datasets:
  gopro:
    roots:
      - /mnt/ssd1/z00919662/motion_deblur/datasets/GoPro
      - /mnt/ssd1/z00919662/motion_deblur/datasets/gopro
      - /mnt/ssd1/z00919662/motion_deblur/datasets/GOPRO_Large
      - /mnt/ssd1/z00919662/motion_deblur_backup/datasets/GoPro
  bsd:
    roots:
      - /mnt/ssd1/z00919662/motion_deblur/datasets/BSD
      - /mnt/ssd1/z00919662/datasets/BSD
      - /mnt/ssd1/z00919662/RVRT/datasets/BSD
  dvd:
    roots:
      - /mnt/ssd1/z00919662/motion_deblur/datasets/DVD
      - /mnt/ssd1/z00919662/motion_deblur/datasets/dvd
      - /mnt/ssd1/z00919662/motion_deblur_backup/datasets/DeepVideoDeblurring_Dataset

model:
  dims: [16, 32, 128, 160, 256]
  depths: [3, 3, 3, 2, 2]
  kernels: [3, 3, 7, 7, 7]
  shift_fold_div: 8
  shift_strength: 0.5
  propagation_strength: 0.25
  propagation_temperature: 0.15
  # Training-only recomputation. It changes neither inference parameters nor MACs.
  activation_checkpointing: true

train:
  clip_length: 3
  spatial_mode: full_frame
  # Zero means native HxW: no crop and no resize. All three frames share the full view.
  crop_size: 0
  batch_size: 1
  gradient_accumulation: 4
  workers: 4
  samples_per_epoch: 20000
  domain_weights:
    gopro: 1.0
    bsd: 1.0
    dvd: 1.0
  # Iteration counts microbatches, not optimizer updates.
  # 360k / 4 = 90k updates; 360k * 3 = 1.08M frames, same as T6 v2.
  total_iters: 360000
  lr: 0.00005
  min_lr: 0.000001
  warmup_iters: 4000
  betas: [0.9, 0.999]
  weight_decay: 0.0001
  clip_grad: 1.0
  ema_decay: 0.999
  amp: true
  log_every: 100
  validate_every: 10000
  save_every: 10000

loss:
  pixel_weight: 1.0
  fft_weight: 0.05
  edge_weight: 0.1
  temporal_weight: 0.15
  acceleration_weight: 0.03
  temporal_start_iter: 10000
  temporal_ramp_iters: 40000

validation:
  # Native full frames here as well. This is not the tiled final benchmark.
  crop_size: 0
  batch_size: 1
  stride: 3
  max_clips_per_domain: 24
